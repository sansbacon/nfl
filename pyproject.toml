[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl"
version = "1.0.0"
description = "Unified NFL fantasy football data library: extraction, normalization, and persistence across Yahoo, FantasyPros, ESPN, Sleeper, and NFLverse sources."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Project Maintainers" }
]
dependencies = [
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "requests-oauthlib>=1.3.1",
    "yfpy>=16.0.3",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "nflreadpy>=0.1.0",
    "polars>=1.5.0",
    "pyarrow>=17.0.0",
]

[project.optional-dependencies]
duckdb = [
    "duckdb>=1.0.0",
]
ibis = [
    "ibis-framework[duckdb]>=9.0.0",
]
ibis-polars = [
    "ibis-framework[polars]>=9.0.0",
]
ibis-pyspark = [
    "ibis-framework[pyspark]>=9.0.0",
]
ibis-all = [
    "ibis-framework[duckdb,polars,pyspark,datafusion]>=9.0.0",
]
databricks = [
    "nfl-databricks>=0.1.0",
]
dev = [
    "ibis-framework[duckdb]>=9.0.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nfl", "nfl.*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "integration: marks tests requiring external APIs or Spark (deselect with '-m not integration')",
    "slow: marks tests that take >10s",
    "ibis: marks tests requiring ibis-framework[duckdb] (deselect with '-m not ibis')",
]
filterwarnings = [
]

[tool.coverage.run]
source = ["nfl"]
omit = ["tests/*", "examples/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["nfl"]