[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-databricks"
version = "0.1.0"
description = "Databricks-specific integrations for the nfl fantasy football library: Unity Catalog storage adapters and Lakeflow Connect connector."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Project Maintainers" }
]
dependencies = [
    "nfl>=0.2.0",
    "polars>=1.5.0",
    "pyarrow>=17.0.0",
    "nflreadpy>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nfl_databricks", "nfl_databricks.*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require Databricks runtime or Spark",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["nfl_databricks", "nfl"]
