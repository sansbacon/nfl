name: nflverse
display_name: nflverse
description: >-
  Ingest NFL data from nflverse (nfl_data_py) including player stats,
  schedules, rosters, snap counts, depth charts, injuries, draft picks,
  and combine results.
documentation_url: https://github.com/nflverse/nfl_data_py

parameters:
  - name: seasons
    display_name: Seasons
    description: >-
      Comma-separated list of NFL seasons (years) to ingest.
      Example: 2022,2023,2024
    type: string
    required: true
    example: "2022,2023,2024"

  - name: season_type
    display_name: Season Type
    description: >-
      Season type for seasonal stats: REG (regular season),
      POST (postseason), or REG_POST (both).
    type: string
    required: false
    default: REG
    enum:
      - REG
      - POST
      - REG_POST

tables:
  - name: player_stats_weekly
    description: Weekly player stats for skill positions (QB, RB, WR, TE, K)
    primary_keys: [player_id, season, week, season_type]

  - name: player_stats_seasonal
    description: Season-level aggregated player stats
    primary_keys: [player_id, season, season_type]

  - name: schedules
    description: Full game schedules with results, location, and officials
    primary_keys: [game_id]

  - name: rosters
    description: Weekly roster data with player bio and team assignment
    primary_keys: [player_id, season, week]

  - name: teams
    description: Team metadata (abbreviation, full name, colors, logos)
    primary_keys: [team_abbr]

  - name: snap_counts
    description: Offensive and defensive snap counts per player per game
    primary_keys: [pfr_player_id, season, week]

  - name: depth_charts
    description: Weekly depth chart positions per player
    primary_keys: [gsis_id, season, week, position, depth_position]

  - name: injuries
    description: Weekly injury report designations
    primary_keys: [gsis_id, season, week]

  - name: draft_picks
    description: Historical draft picks with player and team info
    primary_keys: [pfr_player_id, season]

  - name: combine
    description: NFL Combine measurables and athletic testing results
    primary_keys: [pfr_id, season]
